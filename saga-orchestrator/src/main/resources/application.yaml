spring:
  application:
    name: saga-orchestrator
  config:
    import: vault://
  datasource:
    url: ${SAGA_DB_URL} # Verrà da Vault o variabile d'ambiente
    username: ${SAGA_DB_USER} # Verrà da Vault o variabile d'ambiente
    password: ${SAGA_DB_PASSWORD} # Verrà da Vault o variabile d'ambiente
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  cloud:
    vault:
      host: localhost
      port: 8200
      scheme: http
      authentication: TOKEN
      token: my-root-token # ATTENZIONE: Non hardcodare in produzione! Usare variabili d'ambiente o altri metodi sicuri.
      kv:
        enabled: true
        backend: secret
        default-context: saga-orchestrator

server:
  port: ${SAGA_PORT:8083}

clients:
  events-base-url: ${EVENTS_URL} # Verrà da Vault o variabile d'ambiente
  stands-base-url: ${STANDS_URL} # Verrà da Vault o variabile d'ambiente

sanmartino:
  kafka:
    topics:
      saga-events: sanmartino.saga.events

spring.kafka:
  bootstrap-servers: ${KAFKA_BOOTSTRAP} # Verrà da Vault o variabile d'ambiente
  producer:
    key-serializer: org.apache.kafka.common.serialization.StringSerializer
    value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    properties:
      spring.json.add.type.headers: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

logging:
  level:
    root: INFO
    com.ginogipsy.sanmartino: DEBUG