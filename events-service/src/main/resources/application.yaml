spring:
  application:
    name: events-service
  datasource:
    url: ${EVENTS_DB_URL:jdbc:postgresql://localhost:5433/events}
    username: ${EVENTS_DB_USER:events}
    password: ${EVENTS_DB_PASSWORD:events}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  cloud: # Aggiungi questa sezione per Vault
    vault:
      host: vault # Nome del servizio Vault in docker-compose
      port: 8200
      scheme: http
      authentication: TOKEN
      token: my-root-token # ATTENZIONE: Non hardcodare in produzione! Usare variabili d'ambiente o altri metodi sicuri.

server:
  port: ${EVENTS_PORT:8081}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

logging:
  level:
    root: INFO
    com.ginogipsy.sanmartino: DEBUG
