spring:
  application:
    name: events-service
  config:
    import: vault://
  datasource:
    url: ${EVENTS_DB_URL} # Verrà da Vault o variabile d'ambiente
    username: ${EVENTS_DB_USER} # Verrà da Vault o variabile d'ambiente
    password: ${EVENTS_DB_PASSWORD} # Verrà da Vault o variabile d'ambiente
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  cloud:
    vault:
      host: localhost
      port: 8200
      scheme: http
      authentication: TOKEN
      token: my-root-token # ATTENZIONE: Non hardcodare in produzione! Usare variabili d'ambiente o altri metodi sicuri.
      kv:
        enabled: true
        backend: secret
        default-context: events-service

server:
  port: ${EVENTS_PORT:8081}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

logging:
  level:
    root: INFO
    com.ginogipsy.sanmartino: DEBUG