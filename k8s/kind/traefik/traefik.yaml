# traefik — controller Ingress del cluster locale. In cloud il controller lo
# installa la piattaforma; l'API usata dai manifest (Ingress standard, classe
# `traefik`) è la stessa, quindi l'applicativo non cambia.
#
# Manifest scritti a mano invece del chart Helm: un solo Deployment con il
# provider Ingress, e nessuna dipendenza da Helm per far partire il cluster.
apiVersion: v1
kind: Namespace
metadata:
  name: traefik
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: traefik
  namespace: traefik
---
# Permessi del provider Kubernetes Ingress, dalla documentazione di Traefik v3.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: traefik-ingress-controller
rules:
  - apiGroups: [""]
    resources: ["services", "secrets", "nodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses", "ingressclasses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses/status"]
    verbs: ["update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: traefik-ingress-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: traefik-ingress-controller
subjects:
  - kind: ServiceAccount
    name: traefik
    namespace: traefik
---
# La classe citata da ingressClassName nei manifest dell'applicativo.
apiVersion: networking.k8s.io/v1
kind: IngressClass
metadata:
  name: traefik
spec:
  controller: traefik.io/ingress-controller
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: traefik
  namespace: traefik
  labels:
    app.kubernetes.io/name: traefik
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: traefik
  template:
    metadata:
      labels:
        app.kubernetes.io/name: traefik
    spec:
      serviceAccountName: traefik
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: traefik
          image: traefik:v3.7.18
          args:
            # Porte sopra la 1024: niente NET_BIND_SERVICE.
            - --entryPoints.web.address=:8000
            - --entryPoints.traefik.address=:9000
            - --ping=true
            - --providers.kubernetesingress=true
            # Valorizza lo status degli Ingress: `kubectl get ingress` mostra
            # l'indirizzo da cui il cluster è raggiungibile.
            - --providers.kubernetesingress.ingressendpoint.ip=127.0.0.1
            - --global.checkNewVersion=false
            - --global.sendAnonymousUsage=false
          ports:
            - name: web
              containerPort: 8000
            - name: admin
              containerPort: 9000
          readinessProbe:
            httpGet:
              path: /ping
              port: admin
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /ping
              port: admin
            periodSeconds: 10
          resources:
            requests:
              cpu: 20m
              memory: 48Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
# NodePort fisso: è la porta che k8s/kind/cluster.yaml mappa sulla :80 e sulla
# :8080 dell'host.
apiVersion: v1
kind: Service
metadata:
  name: traefik
  namespace: traefik
  labels:
    app.kubernetes.io/name: traefik
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: traefik
  ports:
    - name: web
      port: 80
      targetPort: web
      nodePort: 30080
