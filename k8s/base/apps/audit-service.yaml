# audit-service — log di audit di business per tutti i microservizi.
# Sicurezza, probe, risorse e configurazione comuni: ../spring-boot-defaults.yaml
apiVersion: v1
kind: ServiceAccount
metadata:
  name: audit-service
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: audit-service
  labels:
    app.kubernetes.io/name: audit-service
    app.kubernetes.io/component: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: audit-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: audit-service
        app.kubernetes.io/component: backend
      annotations:
        prometheus.io/port: "8086"
    spec:
      serviceAccountName: audit-service
      containers:
        - name: app
          # Tag fissato dall'overlay (images:), non qui.
          image: ghcr.io/ginogipsy/sanmartino/audit-service
          ports:
            # Stessa porta di server.port in application.yaml: nessun override,
            # e gli URL interni restano quelli già noti (http://audit-service:8086).
            - name: http
              containerPort: 8086
---
apiVersion: v1
kind: Service
metadata:
  name: audit-service
  labels:
    app.kubernetes.io/name: audit-service
spec:
  selector:
    app.kubernetes.io/name: audit-service
  ports:
    - name: http
      port: 8086
      targetPort: http
