# stands-service — cantine e stand gastronomici.
# Sicurezza, probe, risorse e configurazione comuni: ../spring-boot-defaults.yaml
apiVersion: v1
kind: ServiceAccount
metadata:
  name: stands-service
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stands-service
  labels:
    app.kubernetes.io/name: stands-service
    app.kubernetes.io/component: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: stands-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: stands-service
        app.kubernetes.io/component: backend
      annotations:
        prometheus.io/port: "8082"
    spec:
      serviceAccountName: stands-service
      containers:
        - name: app
          # Tag fissato dall'overlay (images:), non qui.
          image: ghcr.io/ginogipsy/sanmartino/stands-service
          ports:
            # Stessa porta di server.port in application.yaml: nessun override,
            # e gli URL interni restano quelli già noti (http://stands-service:8082).
            - name: http
              containerPort: 8082
---
apiVersion: v1
kind: Service
metadata:
  name: stands-service
  labels:
    app.kubernetes.io/name: stands-service
spec:
  selector:
    app.kubernetes.io/name: stands-service
  ports:
    - name: http
      port: 8082
      targetPort: http
