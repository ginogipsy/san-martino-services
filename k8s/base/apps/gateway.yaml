# gateway — punto di ingresso HTTP: routing verso i servizi, circuit breaker Resilience4j.
# Sicurezza, probe, risorse e configurazione comuni: ../spring-boot-defaults.yaml
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gateway
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  labels:
    app.kubernetes.io/name: gateway
    app.kubernetes.io/component: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gateway
        app.kubernetes.io/component: backend
      annotations:
        prometheus.io/port: "8080"
    spec:
      serviceAccountName: gateway
      containers:
        - name: app
          # Tag fissato dall'overlay (images:), non qui.
          image: ghcr.io/ginogipsy/sanmartino/gateway
          ports:
            # Stessa porta di server.port in application.yaml: nessun override,
            # e gli URL interni restano quelli già noti (http://gateway:8080).
            - name: http
              containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  labels:
    app.kubernetes.io/name: gateway
spec:
  selector:
    app.kubernetes.io/name: gateway
  ports:
    - name: http
      port: 8080
      targetPort: http
