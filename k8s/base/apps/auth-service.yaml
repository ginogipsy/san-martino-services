# auth-service — autenticazione, wrapper dell'Admin API di Keycloak.
# Sicurezza, probe, risorse e configurazione comuni: ../spring-boot-defaults.yaml
apiVersion: v1
kind: ServiceAccount
metadata:
  name: auth-service
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  labels:
    app.kubernetes.io/name: auth-service
    app.kubernetes.io/component: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: auth-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: auth-service
        app.kubernetes.io/component: backend
      annotations:
        prometheus.io/port: "8085"
    spec:
      serviceAccountName: auth-service
      containers:
        - name: app
          # Tag fissato dall'overlay (images:), non qui.
          image: ghcr.io/ginogipsy/sanmartino/auth-service
          ports:
            # Stessa porta di server.port in application.yaml: nessun override,
            # e gli URL interni restano quelli già noti (http://auth-service:8085).
            - name: http
              containerPort: 8085
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  labels:
    app.kubernetes.io/name: auth-service
spec:
  selector:
    app.kubernetes.io/name: auth-service
  ports:
    - name: http
      port: 8085
      targetPort: http
