# saga-orchestrator — transazioni distribuite fra events e stands, eventi su Kafka.
# Sicurezza, probe, risorse e configurazione comuni: ../spring-boot-defaults.yaml
apiVersion: v1
kind: ServiceAccount
metadata:
  name: saga-orchestrator
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: saga-orchestrator
  labels:
    app.kubernetes.io/name: saga-orchestrator
    app.kubernetes.io/component: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: saga-orchestrator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: saga-orchestrator
        app.kubernetes.io/component: backend
      annotations:
        prometheus.io/port: "8083"
    spec:
      serviceAccountName: saga-orchestrator
      containers:
        - name: app
          # Tag fissato dall'overlay (images:), non qui.
          image: ghcr.io/ginogipsy/sanmartino/saga-orchestrator
          ports:
            # Stessa porta di server.port in application.yaml: nessun override,
            # e gli URL interni restano quelli già noti (http://saga-orchestrator:8083).
            - name: http
              containerPort: 8083
---
apiVersion: v1
kind: Service
metadata:
  name: saga-orchestrator
  labels:
    app.kubernetes.io/name: saga-orchestrator
spec:
  selector:
    app.kubernetes.io/name: saga-orchestrator
  ports:
    - name: http
      port: 8083
      targetPort: http
