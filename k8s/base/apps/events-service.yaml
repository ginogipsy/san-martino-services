# events-service — edizioni della festa ed eventi.
# Sicurezza, probe, risorse e configurazione comuni: ../spring-boot-defaults.yaml
apiVersion: v1
kind: ServiceAccount
metadata:
  name: events-service
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: events-service
  labels:
    app.kubernetes.io/name: events-service
    app.kubernetes.io/component: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: events-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: events-service
        app.kubernetes.io/component: backend
      annotations:
        prometheus.io/port: "8081"
    spec:
      serviceAccountName: events-service
      containers:
        - name: app
          # Tag fissato dall'overlay (images:), non qui.
          image: ghcr.io/ginogipsy/sanmartino/events-service
          ports:
            # Stessa porta di server.port in application.yaml: nessun override,
            # e gli URL interni restano quelli già noti (http://events-service:8081).
            - name: http
              containerPort: 8081
---
apiVersion: v1
kind: Service
metadata:
  name: events-service
  labels:
    app.kubernetes.io/name: events-service
spec:
  selector:
    app.kubernetes.io/name: events-service
  ports:
    - name: http
      port: 8081
      targetPort: http
