# notifications-service — consumer Kafka, push verso l'app Android via FCM.
# Sicurezza, probe, risorse e configurazione comuni: ../spring-boot-defaults.yaml
apiVersion: v1
kind: ServiceAccount
metadata:
  name: notifications-service
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notifications-service
  labels:
    app.kubernetes.io/name: notifications-service
    app.kubernetes.io/component: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: notifications-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: notifications-service
        app.kubernetes.io/component: backend
      annotations:
        prometheus.io/port: "8084"
    spec:
      serviceAccountName: notifications-service
      containers:
        - name: app
          # Tag fissato dall'overlay (images:), non qui.
          image: ghcr.io/ginogipsy/sanmartino/notifications-service
          ports:
            # Stessa porta di server.port in application.yaml: nessun override,
            # e gli URL interni restano quelli già noti (http://notifications-service:8084).
            - name: http
              containerPort: 8084
---
apiVersion: v1
kind: Service
metadata:
  name: notifications-service
  labels:
    app.kubernetes.io/name: notifications-service
spec:
  selector:
    app.kubernetes.io/name: notifications-service
  ports:
    - name: http
      port: 8084
      targetPort: http
