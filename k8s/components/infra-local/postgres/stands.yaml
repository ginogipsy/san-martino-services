# postgres-stands — database di stands, come il servizio postgres-stands del docker-compose.yml.
# La password arriva dal Secret postgres-stands (chiave `password`), che fornisce l'overlay.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres-stands
  labels:
    app.kubernetes.io/name: postgres-stands
    app.kubernetes.io/component: database
spec:
  serviceName: postgres-stands
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres-stands
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres-stands
        app.kubernetes.io/component: database
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        # Utente `postgres` dell'immagine Alpine. fsGroup rende il volume
        # scrivibile senza un initContainer root che faccia chown.
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: postgres:17-alpine
          env:
            - name: POSTGRES_DB
              value: stands
            - name: POSTGRES_USER
              value: stands
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-stands
                  key: password
            # Sottocartella del volume: la radice di un PersistentVolume può
            # contenere lost+found, e initdb rifiuta una directory non vuota.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - name: postgres
              containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "stands", "-d", "stands"]
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "stands", "-d", "stands"]
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            # Socket Unix e file temporanei: fuori dal filesystem in sola lettura.
            - name: run
              mountPath: /var/run/postgresql
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-stands
  labels:
    app.kubernetes.io/name: postgres-stands
spec:
  selector:
    app.kubernetes.io/name: postgres-stands
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
