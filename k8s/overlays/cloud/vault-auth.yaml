# ServiceAccount con cui un Vault ESTERNO al cluster valida i token dei
# servizi (TokenReview API). Serve solo se Vault non gira nel cluster: un Vault
# installato nel cluster usa la propria ServiceAccount (vedi
# k8s/components/vault-dev/vault.yaml).
#
# Non basta il token del servizio stesso come credenziale del reviewer: è un
# token con audience `vault`, e l'API server lo rifiuterebbe.
#
# Il token a lunga durata del Secret qui sotto (popolato da Kubernetes) e il CA
# del cluster vanno passati a configure.sh una volta, alla configurazione di
# Vault. Può fare solo TokenReview e SubjectAccessReview.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-auth
---
apiVersion: v1
kind: Secret
metadata:
  name: vault-auth-token
  annotations:
    kubernetes.io/service-account.name: vault-auth
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: sanmartino-vault-auth
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
  - kind: ServiceAccount
    name: vault-auth
    namespace: sanmartino
