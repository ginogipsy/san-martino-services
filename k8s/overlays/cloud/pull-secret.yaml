# Credenziali per scaricare da GHCR le immagini dei servizi e del pannello
# (target per label in kustomization.yaml). I pacchetti dei servizi non sono
# leggibili in modo anonimo. Se un giorno diventano pubblici il riferimento si
# può lasciare: con il Secret assente il kubelet lo segnala e scarica comunque.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pull-secret
spec:
  template:
    spec:
      imagePullSecrets:
        - name: ghcr-pull
