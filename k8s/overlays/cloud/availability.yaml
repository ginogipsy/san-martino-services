# ---------------------------------------------------------------------------
# Disponibilità in cloud.
#
# PodDisruptionBudget: durante la manutenzione di un nodo (drain, upgrade del
# cluster) almeno una replica di ogni servizio resta in piedi.
#
# HorizontalPodAutoscaler sui tre servizi del percorso di lettura più caldo
# (gateway, eventi, cantine), sulla CPU rispetto alla richiesta. Richiede il
# metrics-server, presente di default su GKE e DigitalOcean, da installare su
# EKS. Per questi tre il numero di repliche lo decide l'HPA: kustomization.yaml
# toglie `replicas` dal loro Deployment, altrimenti ogni apply lo
# riporterebbe a 2 in conflitto con l'HPA.
#
# La finestra di scale-up evita la cascata all'avvio: una JVM che parte usa
# molta CPU per qualche secondo, e senza stabilizzazione l'HPA leggerebbe
# quel picco come carico e aggiungerebbe repliche che a loro volta partono.
# ---------------------------------------------------------------------------
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: gateway
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: gateway
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: auth-service
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: auth-service
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: events-service
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: events-service
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: stands-service
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: stands-service
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: saga-orchestrator
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: saga-orchestrator
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: notifications-service
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: notifications-service
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: user-panel
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: user-panel
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: gateway
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: gateway
  minReplicas: 2
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 120
    scaleDown:
      stabilizationWindowSeconds: 300
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: events-service
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: events-service
  minReplicas: 2
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 120
    scaleDown:
      stabilizationWindowSeconds: 300
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: stands-service
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: stands-service
  minReplicas: 2
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 120
    scaleDown:
      stabilizationWindowSeconds: 300
