# Grafana su un host proprio: con un path (/grafana) servirebbe anche
# GF_SERVER_ROOT_URL con serve_from_sub_path, e i link generati da Grafana
# dipenderebbero dal prefisso.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: grafana
spec:
  ingressClassName: traefik
  rules:
    - host: grafana.sanmartino.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: grafana
                port:
                  name: http
