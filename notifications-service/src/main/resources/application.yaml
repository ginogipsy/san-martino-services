spring:
  application:
    name: notifications-service
  config:
    import: vault://
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP} # Verrà da Vault o variabile d'ambiente
    consumer:
      group-id: notifications-service
      auto-offset-reset: earliest
      # Deserializers configurati in KafkaConsumerConfig per usare l'ObjectMapper
      # di Spring (con JavaTimeModule) e wrappare in ErrorHandlingDeserializer.
  cloud:
    vault:
      host: localhost
      port: 8200
      scheme: http
      authentication: TOKEN
      token: my-root-token # ATTENZIONE: Non hardcodare in produzione! Usare variabili d'ambiente o altri metodi sicuri.
      kv:
        enabled: true
        backend: secret
        default-context: notifications-service

server:
  port: ${NOTIFICATIONS_PORT:8084}

sanmartino:
  kafka:
    topics:
      saga-events: sanmartino.saga.events
  fcm:
    enabled: false
    credentials-path: ${FCM_CREDENTIALS} # Verrà da Vault o variabile d'ambiente

management:
  metrics:
    tags:
      # Label comune a tutte le metriche: in Prometheus/Grafana distingue i servizi
      # anche quando la stessa query aggrega piu' job.
      application: ${spring.application.name}
    distribution:
      # Buckets sul timer delle richieste HTTP: senza istogramma Prometheus non puo'
      # calcolare i quantili (il timer esporterebbe solo count, sum e max).
      percentiles-histogram:
        http.server.requests: true
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

# --- Logging & observability ---------------------------------------------
# L'aspect di logging (parametri, durata, esiti) e il correlation id arrivano da
# common-observability, con i default della libreria. Le property configurabili
# sono `sanmartino.observability.*`, documentate in docs/observability.md.
logging:
  level:
    root: INFO
    com.ginogipsy.sanmartino: DEBUG
    org.apache.kafka: WARN
  # Correlation id anche sulla console, dove il formato non e' JSON.
  pattern:
    level: "%5p [${spring.application.name},%X{correlationId:-}]"
  # File di log per servizio: e' la sorgente che Promtail spedisce a Loki.
  # LOG_DIR e' relativo alla working directory del processo (IntelliJ usa la
  # cartella del modulo, `mvnw spring-boot:run` la stessa).
  file:
    name: ${LOG_DIR:./logs}/${spring.application.name}.log
  structured:
    format:
      # Console leggibile in sviluppo; con LOG_CONSOLE_FORMAT=ecs diventa JSON,
      # utile quando il servizio gira in container e i log escono su stdout.
      console: ${LOG_CONSOLE_FORMAT:}
      # Elastic Common Schema: JSON con `log.level`, `service.name`, `message` e
      # le chiavi MDC (correlationId, operation, durationMs, outcome) come campi.
      file: ecs
    ecs:
      service:
        name: ${spring.application.name}
        version: ${LOG_SERVICE_VERSION:0.0.1}
        environment: ${LOG_ENVIRONMENT:local}
