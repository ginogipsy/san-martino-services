spring:
  application:
    name: notifications-service
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    consumer:
      group-id: notifications-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
        spring.json.value.default.type: com.ginogipsy.sanmartino.notifications.event.SagaEvent
        spring.json.use.type.headers: false

server:
  port: ${NOTIFICATIONS_PORT:8084}

sanmartino:
  kafka:
    topics:
      saga-events: sanmartino.saga.events
  fcm:
    enabled: false
    credentials-path: ${FCM_CREDENTIALS:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

logging:
  level:
    root: INFO
    com.ginogipsy.sanmartino: DEBUG
    org.apache.kafka: WARN
