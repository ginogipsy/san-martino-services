spring:
  application:
    name: audit-service
  config:
    import: vault://
  datasource:
    url: ${AUDIT_DB_URL:jdbc:postgresql://localhost:5438/audit}
    username: ${AUDIT_DB_USER:audit}
    password: ${AUDIT_DB_PASSWORD:audit}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    listener:
      observation-enabled: true
    consumer:
      group-id: audit-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: "*"
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:9080/realms/san-martino}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:9080/realms/san-martino/protocol/openid-connect/certs}
  cloud:
    vault:
      host: ${VAULT_HOST:localhost}
      port: ${VAULT_PORT:8200}
      scheme: ${VAULT_SCHEME:http}
      authentication: TOKEN
      token: ${VAULT_TOKEN:my-root-token}
      kv:
        enabled: true
        backend: secret
        default-context: audit-service

server:
  port: ${AUDIT_PORT:8086}

sanmartino:
  observability:
    audit:
      topic: sanmartino.audit.events

management:
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized

# --- Logging & observability ---------------------------------------------
logging:
  level:
    root: INFO
    com.ginogipsy.sanmartino: DEBUG
  pattern:
    level: "%5p [${spring.application.name},%X{traceId:-},%X{spanId:-},%X{correlationId:-}]"
  file:
    name: ${LOG_DIR:./logs}/${spring.application.name}.log
  structured:
    format:
      console: ${LOG_CONSOLE_FORMAT:}
      file: ecs
    ecs:
      service:
        name: ${spring.application.name}
        version: ${LOG_SERVICE_VERSION:0.0.1}
        environment: ${LOG_ENVIRONMENT:local}
