# ---------------------------------------------------------------------------
# Le configurazioni di questa cartella servono a due runtime: il
# docker-compose.yml le monta come file, il cluster Kubernetes le riceve come
# ConfigMap generate da qui. Una sola copia per entrambi.
#
# Questa kustomization sta qui, e non sotto k8s/, perché Kustomize legge solo
# file dentro la cartella della kustomization. La include il componente
# k8s/components/observability: da sola non si applica.
#
# Prometheus e Promtail NON sono qui: la versione Kubernetes di prometheus.yml
# (service discovery al posto dei target statici) e la raccolta log (Alloy al
# posto di Promtail) sono diverse per costruzione e stanno nel componente.
# ---------------------------------------------------------------------------
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

configMapGenerator:
  # URL http://prometheus:9090 e http://loki:3100: in Kubernetes sono i nomi
  # dei Service, quindi il file vale così com'è.
  - name: grafana-datasources
    files:
      - grafana/provisioning/datasources/datasources.yml
  - name: grafana-dashboard-provider
    files:
      - grafana/provisioning/dashboards/dashboards.yml
  # Una dashboard nuova in grafana/dashboards/ va aggiunta anche qui: il
  # generator non accetta glob.
  - name: grafana-dashboards
    files:
      - grafana/dashboards/san-martino-overview.json
  - name: loki-config
    files:
      - loki/loki-config.yml
