# Tempo — configurazione minima single-binary per sviluppo locale e cluster K8s.
# Riceve le tracce via OpenTelemetry (OTLP HTTP su 4318 e OTLP gRPC su 4317)
# e risponde alle query di Grafana sulla porta 3200.

stream_over_http_enabled: true

server:
  http_listen_port: 3200
  log_level: warn

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

ingester:
  max_block_duration: 5m

compactor:
  compaction:
    block_retention: 24h

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

usage_report:
  reporting_enabled: false
