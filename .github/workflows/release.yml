name: Release & Smart Versioning

on:
  push:
    branches:
      - master

jobs:
  release:
    name: Create Release & Bump Version
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read

    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 26
        uses: actions/setup-java@v4
        with:
          java-version: '26'
          distribution: 'temurin'
          cache: maven

      - name: Determine Version
        id: versioning
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 1. Legge la versione attuale dal pom.xml (base per il calcolo)
          CURRENT_VERSION=$(./mvnw help:evaluate -Dexpression=project.version -q -DforceStdout)
          echo "Versione attuale nel POM: $CURRENT_VERSION"
          
          # 2. Analizza la PR di merge per capire l'intento
          PR_NUMBER=$(git log -1 --pretty=%B | grep -oP 'Merge pull request #\K\d+' || true)
          
          INC_TYPE="patch"
          REQ_VERSION=""
          
          if [ ! -z "$PR_NUMBER" ]; then
            echo "Analizzando PR #$PR_NUMBER..."
            # Controlla etichette (major, minor)
            LABELS=$(gh pr view "$PR_NUMBER" --json labels -q '.labels[].name')
            if echo "$LABELS" | grep -iq "major"; then
              INC_TYPE="major"
            elif echo "$LABELS" | grep -iq "minor"; then
              INC_TYPE="minor"
            fi
            
            # Controlla se il branch ha un nome versione (es. release/1.2.0) alla fine
            BRANCH=$(gh pr view "$PR_NUMBER" --json headRefName -q '.headRefName')
            if [[ "$BRANCH" =~ ([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
              REQ_VERSION="${BASH_REMATCH[1]}"
              echo "Versione rilevata dal branch ($BRANCH): $REQ_VERSION"
            fi
          fi
          
          # 3. Calcola la versione da RILASCIARE (Tag)
          if [ ! -z "$REQ_VERSION" ]; then
            RELEASE_VERSION="$REQ_VERSION"
          else
            IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT_VERSION"
            if [ "$INC_TYPE" == "major" ]; then
              RELEASE_VERSION="$((MAJOR + 1)).0.0"
            elif [ "$INC_TYPE" == "minor" ]; then
              RELEASE_VERSION="$MAJOR.$((MINOR + 1)).0"
            else
              # Se è patch, usiamo la versione attuale del POM
              RELEASE_VERSION="$CURRENT_VERSION"
            fi
          fi
          
          echo "RELEASE_VERSION=$RELEASE_VERSION" >> $GITHUB_ENV
          echo "release_version=$RELEASE_VERSION" >> $GITHUB_OUTPUT

      - name: Create Git Tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "v${{ env.RELEASE_VERSION }}" -m "Release v${{ env.RELEASE_VERSION }}"
          git push origin "v${{ env.RELEASE_VERSION }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.RELEASE_VERSION }}
          name: Release v${{ env.RELEASE_VERSION }}
          generate_release_notes: true

      - name: Checkout develop for bump
        run: |
          git checkout develop
          git pull origin develop

      - name: Bump Version for next cycle
        run: |
          REL_VERSION=${{ steps.versioning.outputs.release_version }}
          
          # Incrementiamo sempre la patch per il prossimo giro di develop
          IFS='.' read -r MAJOR MINOR PATCH <<< "$REL_VERSION"
          NEW_VERSION="$MAJOR.$MINOR.$((PATCH + 1))"
          
          ./mvnw versions:set -DnewVersion="$NEW_VERSION" -DgenerateBackupPoms=false
          
          echo "NEXT_VERSION=$NEW_VERSION" >> $GITHUB_ENV

      - name: Commit and Push Bump
        run: |
          git add **/pom.xml pom.xml
          git commit -m "chore(release): bump version to ${{ env.NEXT_VERSION }} [skip ci]"
          git push origin develop
