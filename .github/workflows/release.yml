name: Release & Smart Versioning

# ---------------------------------------------------------------------------
# Creazione del tag git, della GitHub Release e bump automatico su develop.
#
# Allineato a sanmartinoapp e san-martino-user-panel:
#   - Chiamato da ci-cd.yml (`workflow_call`) su push a master solo dopo che
#     build-test e build-images sono passati, ricevendo la versione già risolta
#     dallo Smart Versioning.
#   - Avviabile anche manualmente da UI (`workflow_dispatch`) su master con
#     possibilità di forzare `manual_version` (es. 2.1.0).
# ---------------------------------------------------------------------------

on:
  workflow_call:
    inputs:
      version:
        description: Versione da rilasciare calcolata da ci-cd.yml (Smart Versioning)
        required: false
        default: ''
        type: string
  workflow_dispatch:
    inputs:
      manual_version:
        description: 'Forza una versione specifica (es: 2.1.0). Lascia vuoto per Smart Versioning automatico.'
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  release:
    name: Tag, GitHub Release & Bump develop
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: write        # tag, GitHub Release, commit del bump su develop
      pull-requests: read    # per risalire alla PR mergiata e alle label

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Restore Maven repository (read-only)
        uses: actions/cache/restore@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml', '.mvn/wrapper/maven-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-m2-

      - name: Determine Release Version (Smart Versioning)
        id: versioning
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CALLER_VERSION: ${{ inputs.version }}
          MANUAL_VERSION: ${{ inputs.manual_version }}
          MAVEN_ARGS: '-B -ntp'
        run: |
          set -euo pipefail

          if [ -n "${MANUAL_VERSION:-}" ]; then
            version="$MANUAL_VERSION"
            echo "Versione forzata manualmente da workflow_dispatch: ${version}"
          elif [ -n "${CALLER_VERSION:-}" ]; then
            version="$CALLER_VERSION"
            echo "Versione ricevuta da ci-cd.yml (Smart Versioning): ${version}"
          else
            pom_version="$(./mvnw -q help:evaluate -Dexpression=project.version -DforceStdout)"
            version="$pom_version"

            message="$(git log -1 --pretty=%B)"
            pr_number="$(printf '%s' "$message" | grep -oP 'Merge pull request #\K[0-9]+' || true)"
            branch="$(printf '%s' "$message" | grep -oP '^Merge pull request #[0-9]+ from [^/]+/\K\S+' || true)"
            if [ -z "$branch" ]; then
              branch="$(gh pr list --search "$GITHUB_SHA" --state merged --json headRefName -q '.[0].headRefName' 2>/dev/null || true)"
            fi
            if [ -z "$pr_number" ]; then
              pr_number="$(gh pr list --search "$GITHUB_SHA" --state merged --json number -q '.[0].number' 2>/dev/null || true)"
            fi

            if [[ "$branch" =~ ^(release|hotfix)/v?([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
              version="${BASH_REMATCH[2]}"
              echo "Smart Versioning: versione estratta dal branch '${branch}' -> ${version}"
            else
              latest_tag="$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' | sed 's/^v//' | sort -V | tail -1 || true)"
              base_version="$pom_version"
              if [ -n "$latest_tag" ]; then
                base_version="$(printf '%s\n%s\n' "$pom_version" "$latest_tag" | sort -V | tail -1)"
              fi
              labels=""
              if [ -n "${pr_number:-}" ]; then
                labels="$(gh pr view "$pr_number" --json labels -q '.labels[].name' 2>/dev/null || true)"
              fi
              IFS=. read -r maj min pat <<< "$base_version"
              if printf '%s\n' "$labels" | grep -iq '^major$'; then
                version="$((maj + 1)).0.0"
              elif printf '%s\n' "$labels" | grep -iq '^minor$'; then
                version="${maj}.$((min + 1)).0"
              elif git rev-parse -q --verify "refs/tags/v${version}" >/dev/null; then
                version="${maj}.${min}.$((pat + 1))"
                while git rev-parse -q --verify "refs/tags/v${version}" >/dev/null; do
                  IFS=. read -r maj min pat <<< "$version"
                  version="${maj}.${min}.$((pat + 1))"
                done
              fi
            fi
          fi

          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error title=Formato versione non valido::'${version}' non rispetta il formato X.Y.Z."
            exit 1
          fi

          tag="v${version}"
          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            existing="$(git rev-parse --short "refs/tags/${tag}^{commit}")"
            echo "::error title=Tag già esistente::${tag} esiste già e punta a ${existing}. Scegli una versione superiore."
            exit 1
          fi

          echo "RELEASE_VERSION=${version}" >> "$GITHUB_ENV"
          echo "TAG=${tag}"                 >> "$GITHUB_ENV"
          echo "✅ Versione di rilascio determinata: ${tag}"

      - name: Create the tag
        run: |
          set -euo pipefail
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "refs/tags/${TAG}"
          echo "### 🚀 Release \`${TAG}\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: Release ${{ env.TAG }}
          generate_release_notes: true

      - name: Bump develop to the next patch
        env:
          MAVEN_ARGS: '-B -ntp'
        run: |
          set -euo pipefail
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git fetch --quiet origin develop
          git checkout -B develop FETCH_HEAD

          current="$(./mvnw -q help:evaluate -Dexpression=project.version -DforceStdout)"
          IFS=. read -r major minor patch <<< "$RELEASE_VERSION"
          next="${major}.${minor}.$((patch + 1))"

          # Non regredire mai develop se è già >= next (es. hotfix su major/minor precedente)
          highest="$(printf '%s\n%s\n' "$current" "$next" | sort -V | tail -1)"
          if [ "$highest" = "$current" ] && [ "$current" != "$RELEASE_VERSION" ]; then
            echo "develop è già a ${current} (>= ${next}): nessun bump necessario."
            echo "- develop resta a \`${current}\` (già ≥ \`${next}\`)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          ./mvnw -q versions:set-property -Dproperty=revision -DnewVersion="$next" -DgenerateBackupPoms=false

          git add -- '*pom.xml'

          if git diff --cached --quiet; then
            echo "::warning title=Bump a vuoto::versions:set-property non ha modificato nulla — develop resta a ${current}."
            exit 0
          fi

          git commit -m "chore(release): bump version to ${next} [skip ci]"

          for attempt in 1 2 3; do
            if git pull --rebase --autostash origin develop \
               && git push origin HEAD:develop; then
              echo "- develop portato a \`${next}\`" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "::notice::push su develop non riuscito (tentativo ${attempt}/3), ritento."
            sleep $((attempt * 5))
          done

          echo "::error title=Bump non applicato::${TAG} è stato pubblicato, ma il push su develop (${next}) non è riuscito dopo 3 tentativi."
          exit 1
