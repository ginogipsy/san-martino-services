name: Release & Smart Versioning

on:
  push:
    branches:
      - master
  workflow_dispatch: # Consente il lancio manuale da interfaccia GitHub

jobs:
  release:
    name: Create Release & Bump Version
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read

    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 26
        uses: actions/setup-java@v5
        with:
          java-version: '26'
          distribution: 'temurin'
          cache: maven

      - name: Grant execute permission for mvnw
        run: chmod +x mvnw

      - name: Determine Version
        id: versioning
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 1. Legge la versione attuale dal pom.xml
          CURRENT_VERSION=$(./mvnw help:evaluate -Dexpression=project.version -q -DforceStdout)
          echo "Versione attuale nel POM: $CURRENT_VERSION"
          
          # 2. Analizza il contesto (PR o Branch)
          COMMIT_MSG=$(git log -1 --pretty=%B)
          PR_NUMBER=$(echo "$COMMIT_MSG" | grep -oP 'Merge pull request #\K\d+' || true)
          
          INC_TYPE="patch"
          REQ_VERSION=""
          BRANCH_NAME=""

          # Estrazione branch dal messaggio di commit
          BRANCH_NAME=$(echo "$COMMIT_MSG" | grep -oP 'from \S+/\K\S+' || true)
          
          if [ ! -z "$PR_NUMBER" ] && [ -z "$BRANCH_NAME" ]; then
            echo "Recupero info PR #$PR_NUMBER..."
            BRANCH_NAME=$(gh pr view "$PR_NUMBER" --json headRefName -q '.headRefName' || true)
          fi

          if [ ! -z "$BRANCH_NAME" ]; then
            echo "Branch rilevato: $BRANCH_NAME"
            if [[ "$BRANCH_NAME" =~ ([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
              REQ_VERSION="${BASH_REMATCH[1]}"
              echo "Versione forzata da branch: $REQ_VERSION"
            fi
            
            if [ ! -z "$PR_NUMBER" ]; then
              LABELS=$(gh pr view "$PR_NUMBER" --json labels -q '.labels[].name' 2>/dev/null || true)
              if echo "$LABELS" | grep -iq "major"; then
                INC_TYPE="major"
              elif echo "$LABELS" | grep -iq "minor"; then
                INC_TYPE="minor"
              fi
            fi
          fi
          
          # 3. Calcolo versione di rilascio
          if [ ! -z "$REQ_VERSION" ]; then
            RELEASE_VERSION="$REQ_VERSION"
          else
            IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT_VERSION"
            if [ "$INC_TYPE" == "major" ]; then
              RELEASE_VERSION="$((MAJOR + 1)).0.0"
            elif [ "$INC_TYPE" == "minor" ]; then
              RELEASE_VERSION="$MAJOR.$((MINOR + 1)).0"
            else
              RELEASE_VERSION="$CURRENT_VERSION"
            fi
          fi
          
          echo "RELEASE_VERSION=$RELEASE_VERSION" >> $GITHUB_ENV
          echo "release_version=$RELEASE_VERSION" >> $GITHUB_OUTPUT
          echo "### 🚀 Release Target: \`$RELEASE_VERSION\`" >> $GITHUB_STEP_SUMMARY

      - name: Create Git Tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Elimina tag locale se esistente (per evitare conflitti in caso di retry)
          git tag -d "v${{ env.RELEASE_VERSION }}" 2>/dev/null || true
          git tag -a "v${{ env.RELEASE_VERSION }}" -m "Release v${{ env.RELEASE_VERSION }}"
          git push origin "v${{ env.RELEASE_VERSION }}" --force

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.RELEASE_VERSION }}
          name: Release v${{ env.RELEASE_VERSION }}
          generate_release_notes: true

      - name: Checkout develop for bump
        run: |
          git checkout develop
          git pull origin develop

      - name: Bump Version for next cycle
        run: |
          REL_VERSION=${{ steps.versioning.outputs.release_version }}
          IFS='.' read -r MAJOR MINOR PATCH <<< "$REL_VERSION"
          NEXT_VERSION="$MAJOR.$MINOR.$((PATCH + 1))"
          
          echo "Aggiornamento develop alla versione: $NEXT_VERSION"
          ./mvnw versions:set -DnewVersion="$NEXT_VERSION" -DgenerateBackupPoms=false
          echo "NEXT_VERSION=$NEXT_VERSION" >> $GITHUB_ENV

      - name: Commit and Push Bump
        run: |
          git add **/pom.xml pom.xml
          # [skip ci] per evitare loop infiniti
          git commit -m "chore(release): bump version to ${{ env.NEXT_VERSION }} [skip ci]"
          git push origin develop
