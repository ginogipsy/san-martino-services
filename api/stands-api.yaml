openapi: 3.0.3
info:
  title: San Martino — Stands API
  description: |
    Gestione delle cantine (stand di cibo e bevande) della festa "Le cantine di
    San Martino" (Arce, FR). Ogni cantina ha proprietari e un menu (cibo + bevande).
  version: 1.0.0
  contact:
    name: viviAMOarce
servers:
  - url: http://localhost:8082
    description: Local dev

tags:
  - name: stands
    description: Cantine
  - name: menu
    description: Menu items (cibo + bevande) di una cantina
  - name: owners
    description: Proprietari di una cantina
  - name: analytics
    description: Analisi ricerche, click sui piatti e interazioni con le cantine
  - name: reviews
    description: Recensioni di utenti su cantine, piatti ed eventi con moderazione
  - name: favorites
    description: Cantine preferite ("Dove voglio andare") salvate dagli utenti autenticati

paths:
  /v1/stands:
    get:
      tags: [stands]
      summary: Elenca tutte le cantine (versione summary)
      operationId: listStands
      responses:
        '200':
          description: Lista di cantine (summary, senza owners/menu)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StandSummary'
    post:
      tags: [stands]
      summary: Crea una nuova cantina
      operationId: createStand
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StandCreate'
      responses:
        '201':
          description: Cantina creata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandDetail'
        '400':
          $ref: '#/components/responses/BadRequest'

  /v1/stands/search:
    get:
      tags: [stands]
      summary: Ricerca intelligente cantine e piatti per nome, parole chiave e descrizione
      description: |
        Cerca tra tutte le cantine e i rispettivi piatti/bevande sfruttando il nome del piatto,
        le parole chiave (`keywords`, es. `pasta, primo, sugo, guanciale`) e le descrizioni IT/EN,
        ordinando i risultati per rilevanza (`score`) e disponibilità.
      operationId: searchStands
      parameters:
        - name: q
          in: query
          required: false
          description: Testo ricercato (es. "pasta", "amatriciana", "guanciale", "tartufo")
          schema:
            type: string
        - name: kind
          in: query
          required: false
          description: Filtra i piatti corrispondenti per tipologia (FOOD o DRINK)
          schema:
            $ref: '#/components/schemas/MenuKind'
        - name: onlyAvailable
          in: query
          required: false
          description: Se true, considera solo i piatti con porzioni disponibili (`availablePlates > 0`)
          schema:
            type: boolean
            default: false
        - name: lat
          in: query
          required: false
          description: Latitudine utente (opzionale) per boost di vicinanza GPS a parità di rilevanza
          schema:
            type: number
            format: double
            minimum: -90
            maximum: 90
        - name: lng
          in: query
          required: false
          description: Longitudine utente (opzionale) per boost di vicinanza GPS a parità di rilevanza
          schema:
            type: number
            format: double
            minimum: -180
            maximum: 180
      responses:
        '200':
          description: Risultati della ricerca ordinati per punteggio di rilevanza decrescente
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StandSearchResult'

  /v1/stands/analytics/interactions:
    post:
      tags: [ analytics ]
      summary: Registra un click su un piatto o un'interazione con una cantina
      operationId: recordInteraction
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StandInteractionCreate'
      responses:
        '204':
          description: Interazione registrata con successo
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/stands/analytics/summary:
    get:
      tags: [ analytics ]
      summary: Riepilogo analitico delle ricerche effettuate e dei piatti/cantine più cliccati
      operationId: getAnalyticsSummary
      parameters:
        - name: limit
          in: query
          required: false
          description: Numero massimo di elementi per ciascuna classifica (default 10)
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
      responses:
        '200':
          description: Statistiche aggregate su ricerche, piatti più richiesti e cantine più visitate
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandAnalyticsSummary'

  /v1/stands/reviews:
    get:
      tags: [ reviews ]
      summary: Elenca le recensioni filtrando per tipo target, ID target e stato di moderazione
      operationId: listReviews
      parameters:
        - name: targetType
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/ReviewTargetType'
        - name: targetId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/ReviewStatus'
      responses:
        '200':
          description: Lista delle recensioni
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FestivalReview'
    post:
      tags: [ reviews ]
      summary: Invia una nuova recensione (creata in stato PENDING per approvazione moderatore)
      operationId: createReview
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FestivalReviewCreate'
      responses:
        '201':
          description: Recensione inviata e messa in coda di moderazione
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FestivalReview'
        '400':
          $ref: '#/components/responses/BadRequest'

  /v1/stands/reviews/{reviewId}/moderation:
    parameters:
      - name: reviewId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    put:
      tags: [ reviews ]
      summary: Approva o rifiuta una recensione (riservato a Moderatori e Admin)
      operationId: moderateReview
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FestivalReviewModeration'
      responses:
        '200':
          description: Stato di moderazione aggiornato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FestivalReview'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/stands/favorites:
    get:
      tags: [ favorites ]
      summary: Elenca gli ID delle cantine preferite dell'utente autenticato
      operationId: listFavoriteStandIds
      responses:
        '200':
          description: Lista degli UUID delle cantine salvate tra i preferiti dall'utente corrente
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
                  format: uuid

  /v1/stands/favorites/{standId}:
    parameters:
      - name: standId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    put:
      tags: [ favorites ]
      summary: Aggiunge una cantina ai preferiti ("Dove voglio andare") dell'utente autenticato
      operationId: addFavoriteStand
      responses:
        '204':
          description: Cantina aggiunta ai preferiti (operazione idempotente)
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [ favorites ]
      summary: Rimuove una cantina dai preferiti dell'utente autenticato
      operationId: removeFavoriteStand
      responses:
        '204':
          description: Cantina rimossa dai preferiti (operazione idempotente)

  /v1/stands/{id}:
    parameters:
      - $ref: '#/components/parameters/StandId'
    get:
      tags: [stands]
      summary: Dettaglio di una cantina (include owners e menu)
      operationId: getStand
      responses:
        '200':
          description: Cantina trovata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandDetail'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [stands]
      summary: Aggiorna info base di una cantina
      operationId: updateStand
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StandUpdate'
      responses:
        '200':
          description: Cantina aggiornata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandDetail'
        '404':
          $ref: '#/components/responses/NotFound'
        '400':
          $ref: '#/components/responses/BadRequest'
    delete:
      tags: [stands]
      summary: Elimina una cantina (cascade su owners e menu)
      operationId: deleteStand
      responses:
        '204':
          description: Eliminata
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/stands/{id}/menu-items:
    parameters:
      - $ref: '#/components/parameters/StandId'
    get:
      tags: [menu]
      summary: Lista del menu di una cantina
      operationId: listMenuItems
      parameters:
        - name: kind
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/MenuKind'
      responses:
        '200':
          description: Menu della cantina (filtrato per kind se passato)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MenuItem'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [menu]
      summary: Aggiunge un piatto o bevanda al menu
      operationId: addMenuItem
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MenuItemCreate'
      responses:
        '201':
          description: Item aggiunto
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MenuItem'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/stands/{id}/menu-items/{itemId}:
    parameters:
      - $ref: '#/components/parameters/StandId'
      - name: itemId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    put:
      tags: [menu]
      summary: Aggiorna un item del menu (incluso il conteggio piatti disponibili)
      operationId: updateMenuItem
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MenuItemUpdate'
      responses:
        '200':
          description: Item aggiornato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MenuItem'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [menu]
      summary: Rimuovi un item dal menu
      operationId: deleteMenuItem
      responses:
        '204':
          description: Rimosso
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/stands/{id}/owners:
    parameters:
      - $ref: '#/components/parameters/StandId'
    get:
      tags: [owners]
      summary: Lista proprietari della cantina
      operationId: listOwners
      responses:
        '200':
          description: Proprietari
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Owner'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [owners]
      summary: Aggiungi un proprietario alla cantina
      operationId: addOwner
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OwnerCreate'
      responses:
        '201':
          description: Proprietario aggiunto
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Owner'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/stands/{id}/owners/{ownerId}:
    parameters:
      - $ref: '#/components/parameters/StandId'
      - name: ownerId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    delete:
      tags: [owners]
      summary: Rimuovi un proprietario
      operationId: deleteOwner
      responses:
        '204':
          description: Rimosso
        '404':
          $ref: '#/components/responses/NotFound'

components:
  parameters:
    StandId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid

  schemas:
    MenuKind:
      type: string
      enum: [FOOD, DRINK]

    OwnerRole:
      type: string
      enum: [PRIMARY, SECONDARY]

    LocalizedText:
      type: object
      required: [it, en]
      properties:
        it:
          type: string
        en:
          type: string

    StandSummary:
      type: object
      required: [id, number, name, description, firstParticipationYear, latitude, longitude]
      properties:
        id:
          type: string
          format: uuid
        number:
          type: integer
          description: Numero della cantina come stampato sui volantini (es. 1..58)
        name:
          type: string
          example: "Il tartufo del Tobia"
        description:
          $ref: '#/components/schemas/LocalizedText'
        firstParticipationYear:
          type: integer
        latitude:
          type: number
          format: double
        longitude:
          type: number
          format: double
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    StandDetail:
      allOf:
        - $ref: '#/components/schemas/StandSummary'
        - type: object
          required: [owners, menuItems]
          properties:
            owners:
              type: array
              items:
                $ref: '#/components/schemas/Owner'
            menuItems:
              type: array
              items:
                $ref: '#/components/schemas/MenuItem'

    StandCreate:
      type: object
      required: [number, name, description, firstParticipationYear, latitude, longitude]
      properties:
        number:
          type: integer
          minimum: 1
          maximum: 999
        name:
          type: string
          minLength: 1
          maxLength: 200
        description:
          $ref: '#/components/schemas/LocalizedText'
        firstParticipationYear:
          type: integer
          minimum: 1900
          maximum: 2200
        latitude:
          type: number
          format: double
          minimum: -90
          maximum: 90
        longitude:
          type: number
          format: double
          minimum: -180
          maximum: 180

    StandUpdate:
      type: object
      required: [number, name, description, firstParticipationYear, latitude, longitude]
      properties:
        number:
          type: integer
          minimum: 1
          maximum: 999
        name:
          type: string
          minLength: 1
          maxLength: 200
        description:
          $ref: '#/components/schemas/LocalizedText'
        firstParticipationYear:
          type: integer
          minimum: 1900
          maximum: 2200
        latitude:
          type: number
          format: double
          minimum: -90
          maximum: 90
        longitude:
          type: number
          format: double
          minimum: -180
          maximum: 180

    MenuItem:
      type: object
      required: [id, standId, name, description, availablePlates, kind, keywords]
      properties:
        id:
          type: string
          format: uuid
        standId:
          type: string
          format: uuid
        name:
          type: string
        description:
          $ref: '#/components/schemas/LocalizedText'
        availablePlates:
          type: integer
          minimum: 0
        kind:
          $ref: '#/components/schemas/MenuKind'
        keywords:
          type: array
          description: Parole chiave per search server-side (futura)
          items:
            type: string

    MenuItemCreate:
      type: object
      required: [name, description, availablePlates, kind]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        description:
          $ref: '#/components/schemas/LocalizedText'
        availablePlates:
          type: integer
          minimum: 0
        kind:
          $ref: '#/components/schemas/MenuKind'
        keywords:
          type: array
          items:
            type: string

    MenuItemUpdate:
      type: object
      required: [name, description, availablePlates, kind]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        description:
          $ref: '#/components/schemas/LocalizedText'
        availablePlates:
          type: integer
          minimum: 0
        kind:
          $ref: '#/components/schemas/MenuKind'
        keywords:
          type: array
          items:
            type: string

    Owner:
      type: object
      required: [id, standId, firstName, lastName, role]
      properties:
        id:
          type: string
          format: uuid
        standId:
          type: string
          format: uuid
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
        phone:
          type: string
        role:
          $ref: '#/components/schemas/OwnerRole'

    OwnerCreate:
      type: object
      required: [firstName, lastName, role]
      properties:
        firstName:
          type: string
          minLength: 1
          maxLength: 100
        lastName:
          type: string
          minLength: 1
          maxLength: 100
        email:
          type: string
        phone:
          type: string
        role:
          $ref: '#/components/schemas/OwnerRole'

    StandSearchResult:
      type: object
      required: [stand, matchedItems, score]
      properties:
        stand:
          $ref: '#/components/schemas/StandSummary'
        matchedItems:
          type: array
          description: Piatti o bevande della cantina che corrispondono alla ricerca
          items:
            $ref: '#/components/schemas/MenuItem'
        score:
          type: integer
          description: Punteggio di rilevanza calcolato dall'algoritmo di ricerca

    StandInteractionType:
      type: string
      enum:
        - MENU_ITEM_CLICK
        - STAND_FOOD_OPEN
        - STAND_DRINK_OPEN
        - STAND_DESCRIPTION_OPEN
        - STAND_MAP_OPEN

    StandInteractionCreate:
      type: object
      required: [ standId, interactionType ]
      properties:
        standId:
          type: string
          format: uuid
          description: ID della cantina coinvolta nell'interazione
        menuItemId:
          type: string
          format: uuid
          description: ID del piatto o bevanda cliccato (se interactionType è MENU_ITEM_CLICK)
        interactionType:
          $ref: '#/components/schemas/StandInteractionType'
        searchQuery:
          type: string
          maxLength: 200
          description: Eventuale testo di ricerca attivo al momento del click

    SearchQueryStat:
      type: object
      required: [ query, searchCount, avgResultsCount ]
      properties:
        query:
          type: string
          description: Termine o frase ricercata (normalizzata)
        searchCount:
          type: integer
          format: int64
          description: Numero totale di volte in cui è stata cercata
        avgResultsCount:
          type: number
          format: double
          description: Numero medio di cantine trovate per questa ricerca
        lastSearchedAt:
          type: string
          format: date-time

    MenuItemClickStat:
      type: object
      required: [ menuItemId, menuItemName, kind, standId, standNumber, standName, clickCount ]
      properties:
        menuItemId:
          type: string
          format: uuid
        menuItemName:
          type: string
        kind:
          $ref: '#/components/schemas/MenuKind'
        standId:
          type: string
          format: uuid
        standNumber:
          type: integer
        standName:
          type: string
        clickCount:
          type: integer
          format: int64

    StandClickStat:
      type: object
      required: [ standId, standNumber, standName, interactionCount ]
      properties:
        standId:
          type: string
          format: uuid
        standNumber:
          type: integer
        standName:
          type: string
        interactionCount:
          type: integer
          format: int64

    StandAnalyticsSummary:
      type: object
      required:
        - totalSearches
        - totalInteractions
        - topSearchedQueries
        - zeroResultQueries
        - topClickedMenuItems
        - topClickedStands
      properties:
        totalSearches:
          type: integer
          format: int64
        totalInteractions:
          type: integer
          format: int64
        topSearchedQueries:
          type: array
          items:
            $ref: '#/components/schemas/SearchQueryStat'
        zeroResultQueries:
          type: array
          description: Ricerche che non hanno prodotto risultati (piatti desiderati dagli utenti ma assenti)
          items:
            $ref: '#/components/schemas/SearchQueryStat'
        topClickedMenuItems:
          type: array
          items:
            $ref: '#/components/schemas/MenuItemClickStat'
        topClickedStands:
          type: array
          items:
            $ref: '#/components/schemas/StandClickStat'

    ReviewTargetType:
      type: string
      enum:
        - STAND
        - MENU_ITEM
        - EVENT

    ReviewStatus:
      type: string
      enum:
        - PENDING
        - APPROVED
        - REJECTED

    FestivalReview:
      type: object
      required:
        - id
        - targetType
        - targetId
        - targetName
        - authorUserId
        - authorUsername
        - rating
        - comment
        - status
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        targetType:
          $ref: '#/components/schemas/ReviewTargetType'
        targetId:
          type: string
          format: uuid
        standId:
          type: string
          format: uuid
        targetName:
          type: string
        authorUserId:
          type: string
        authorUsername:
          type: string
        rating:
          type: integer
          minimum: 1
          maximum: 5
        comment:
          type: string
        status:
          $ref: '#/components/schemas/ReviewStatus'
        moderatedBy:
          type: string
        moderationNote:
          type: string
        moderatedAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time

    FestivalReviewCreate:
      type: object
      required: [ targetType, targetId, rating, comment ]
      properties:
        targetType:
          $ref: '#/components/schemas/ReviewTargetType'
        targetId:
          type: string
          format: uuid
        standId:
          type: string
          format: uuid
        targetName:
          type: string
          maxLength: 200
        authorUsername:
          type: string
          maxLength: 120
        rating:
          type: integer
          minimum: 1
          maximum: 5
        comment:
          type: string
          minLength: 2
          maxLength: 1000

    FestivalReviewModeration:
      type: object
      required: [ status ]
      properties:
        status:
          $ref: '#/components/schemas/ReviewStatus'
        moderationNote:
          type: string
          maxLength: 500

    Problem:
      type: object
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string

  responses:
    NotFound:
      description: Risorsa non trovata
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    BadRequest:
      description: Richiesta non valida
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
