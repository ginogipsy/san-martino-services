openapi: 3.0.3
info:
  title: San Martino — Stands API
  description: |
    Gestione delle cantine (stand di cibo e bevande) della festa "Le cantine di
    San Martino" (Arce, FR). Ogni cantina ha proprietari e un menu (cibo + bevande).
  version: 1.0.0
  contact:
    name: viviAMOarce
servers:
  - url: http://localhost:8082
    description: Local dev

tags:
  - name: stands
    description: Cantine
  - name: menu
    description: Menu items (cibo + bevande) di una cantina
  - name: owners
    description: Proprietari di una cantina
  - name: analytics
    description: Analisi ricerche, click sui piatti e interazioni con le cantine
  - name: reviews
    description: Recensioni di utenti su cantine, piatti ed eventi con moderazione
  - name: favorites
    description: Cantine preferite ("Dove voglio andare") salvate dagli utenti autenticati
  - name: keypad
    description: Pulsantiera IoT 10 Slot (3x ESP32 Cassa/Cucina/Consegna), Coda Ordini e Permessi Operatori per Cantina

paths:
  /v1/stands:
    get:
      tags: [stands]
      summary: Elenca tutte le cantine (versione summary)
      operationId: listStands
      responses:
        '200':
          description: Lista di cantine (summary, senza owners/menu)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StandSummary'
    post:
      tags: [stands]
      summary: Crea una nuova cantina
      operationId: createStand
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StandCreate'
      responses:
        '201':
          description: Cantina creata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandDetail'
        '400':
          $ref: '#/components/responses/BadRequest'

  /v1/stands/search:
    get:
      tags: [stands]
      summary: Ricerca intelligente cantine e piatti per nome, parole chiave e descrizione
      description: |
        Cerca tra tutte le cantine e i rispettivi piatti/bevande sfruttando il nome del piatto,
        le parole chiave (`keywords`, es. `pasta, primo, sugo, guanciale`) e le descrizioni IT/EN,
        ordinando i risultati per rilevanza (`score`) e disponibilità.
      operationId: searchStands
      parameters:
        - name: q
          in: query
          required: false
          description: Testo ricercato (es. "pasta", "amatriciana", "guanciale", "tartufo")
          schema:
            type: string
        - name: kind
          in: query
          required: false
          description: Filtra i piatti corrispondenti per tipologia (FOOD o DRINK)
          schema:
            $ref: '#/components/schemas/MenuKind'
        - name: onlyAvailable
          in: query
          required: false
          description: Se true, considera solo i piatti con porzioni disponibili (`availablePlates > 0`)
          schema:
            type: boolean
            default: false
        - name: lat
          in: query
          required: false
          description: Latitudine utente (opzionale) per boost di vicinanza GPS a parità di rilevanza
          schema:
            type: number
            format: double
            minimum: -90
            maximum: 90
        - name: lng
          in: query
          required: false
          description: Longitudine utente (opzionale) per boost di vicinanza GPS a parità di rilevanza
          schema:
            type: number
            format: double
            minimum: -180
            maximum: 180
      responses:
        '200':
          description: Risultati della ricerca ordinati per punteggio di rilevanza decrescente
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StandSearchResult'

  /v1/stands/analytics/interactions:
    post:
      tags: [ analytics ]
      summary: Registra un click su un piatto o un'interazione con una cantina
      operationId: recordInteraction
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StandInteractionCreate'
      responses:
        '204':
          description: Interazione registrata con successo
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/stands/analytics/summary:
    get:
      tags: [ analytics ]
      summary: Riepilogo analitico delle ricerche effettuate e dei piatti/cantine più cliccati
      operationId: getAnalyticsSummary
      parameters:
        - name: limit
          in: query
          required: false
          description: Numero massimo di elementi per ciascuna classifica (default 10)
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
      responses:
        '200':
          description: Statistiche aggregate su ricerche, piatti più richiesti e cantine più visitate
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandAnalyticsSummary'

  /v1/stands/reviews:
    get:
      tags: [ reviews ]
      summary: Elenca le recensioni filtrando per tipo target, ID target e stato di moderazione
      operationId: listReviews
      parameters:
        - name: targetType
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/ReviewTargetType'
        - name: targetId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/ReviewStatus'
      responses:
        '200':
          description: Lista delle recensioni
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FestivalReview'
    post:
      tags: [ reviews ]
      summary: Invia una nuova recensione (creata in stato PENDING per approvazione moderatore)
      operationId: createReview
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FestivalReviewCreate'
      responses:
        '201':
          description: Recensione inviata e messa in coda di moderazione
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FestivalReview'
        '400':
          $ref: '#/components/responses/BadRequest'

  /v1/stands/reviews/{reviewId}/moderation:
    parameters:
      - name: reviewId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    put:
      tags: [ reviews ]
      summary: Approva o rifiuta una recensione (riservato a Moderatori e Admin)
      operationId: moderateReview
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FestivalReviewModeration'
      responses:
        '200':
          description: Stato di moderazione aggiornato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FestivalReview'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/stands/favorites:
    get:
      tags: [ favorites ]
      summary: Elenca gli ID delle cantine preferite dell'utente autenticato
      operationId: listFavoriteStandIds
      responses:
        '200':
          description: Lista degli UUID delle cantine salvate tra i preferiti dall'utente corrente
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
                  format: uuid

  /v1/stands/favorites/{standId}:
    parameters:
      - name: standId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    put:
      tags: [ favorites ]
      summary: Aggiunge una cantina ai preferiti ("Dove voglio andare") dell'utente autenticato
      operationId: addFavoriteStand
      responses:
        '204':
          description: Cantina aggiunta ai preferiti (operazione idempotente)
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [ favorites ]
      summary: Rimuove una cantina dai preferiti dell'utente autenticato
      operationId: removeFavoriteStand
      responses:
        '204':
          description: Cantina rimossa dai preferiti (operazione idempotente)

  /v1/stands/{id}:
    parameters:
      - $ref: '#/components/parameters/StandId'
    get:
      tags: [stands]
      summary: Dettaglio di una cantina (include owners e menu)
      operationId: getStand
      responses:
        '200':
          description: Cantina trovata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandDetail'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [stands]
      summary: Aggiorna info base di una cantina
      operationId: updateStand
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StandUpdate'
      responses:
        '200':
          description: Cantina aggiornata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandDetail'
        '404':
          $ref: '#/components/responses/NotFound'
        '400':
          $ref: '#/components/responses/BadRequest'
    delete:
      tags: [stands]
      summary: Elimina una cantina (cascade su owners e menu)
      operationId: deleteStand
      responses:
        '204':
          description: Eliminata
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/stands/{id}/menu-items:
    parameters:
      - $ref: '#/components/parameters/StandId'
    get:
      tags: [menu]
      summary: Lista del menu di una cantina
      operationId: listMenuItems
      parameters:
        - name: kind
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/MenuKind'
      responses:
        '200':
          description: Menu della cantina (filtrato per kind se passato)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MenuItem'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [menu]
      summary: Aggiunge un piatto o bevanda al menu
      operationId: addMenuItem
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MenuItemCreate'
      responses:
        '201':
          description: Item aggiunto
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MenuItem'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/stands/{id}/menu-items/{itemId}:
    parameters:
      - $ref: '#/components/parameters/StandId'
      - name: itemId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    put:
      tags: [menu]
      summary: Aggiorna un item del menu (incluso il conteggio piatti disponibili)
      operationId: updateMenuItem
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MenuItemUpdate'
      responses:
        '200':
          description: Item aggiornato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MenuItem'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [menu]
      summary: Rimuovi un item dal menu
      operationId: deleteMenuItem
      responses:
        '204':
          description: Rimosso
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/stands/{id}/owners:
    parameters:
      - $ref: '#/components/parameters/StandId'
    get:
      tags: [owners]
      summary: Lista proprietari della cantina
      operationId: listOwners
      responses:
        '200':
          description: Proprietari
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Owner'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [owners]
      summary: Aggiungi un proprietario alla cantina
      operationId: addOwner
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OwnerCreate'
      responses:
        '201':
          description: Proprietario aggiunto
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Owner'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/stands/{id}/owners/{ownerId}:
    parameters:
      - $ref: '#/components/parameters/StandId'
      - name: ownerId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    delete:
      tags: [owners]
      summary: Rimuovi un proprietario
      operationId: deleteOwner
      responses:
        '204':
          description: Rimosso
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/stands/keypad/accessible:
    get:
      tags: [ keypad ]
      summary: Elenca le cantine accessibili dall'utente corrente sulla Pulsantiera/Ordini con i relativi permessi di postazione
      operationId: listAccessibleKeypadStands
      responses:
        '200':
          description: Lista delle cantine su cui l'utente ha almeno un ruolo (OWNER, CASHIER, KITCHEN, DELIVERY, VIEWER)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AccessibleKeypadStand'

  /v1/stands/{id}/keypad/state:
    parameters:
      - $ref: '#/components/parameters/StandId'
    get:
      tags: [ keypad ]
      summary: Stato live della pulsantiera a 10 slot, display 7 segmenti e coda ordini della cantina
      operationId: getStandKeypadState
      parameters:
        - name: station
          in: query
          required: false
          description: Postazione che effettua il polling (per telemetria heartbeat ESP32/Web)
          schema:
            $ref: '#/components/schemas/KeypadStationRole'
        - name: X-Device-Token
          in: header
          required: false
          description: Token hardware opzionale per autenticazione diretta delle 3 schede ESP32 della cantina
          schema:
            type: string
      responses:
        '200':
          description: Stato completo della pulsantiera, dei 10 slot LED/pulsanti, dei display e della coda ordini
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandKeypadState'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/stands/{id}/keypad/slots:
    parameters:
      - $ref: '#/components/parameters/StandId'
    put:
      tags: [ keypad ]
      summary: Configura l'associazione dei 10 slot fisici (1..10) ai piatti/bevande del menu (richiede OWNER o ADMIN)
      operationId: updateStandKeypadSlots
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StandKeypadSlotsUpdate'
      responses:
        '200':
          description: Configurazione slot aggiornata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandKeypadState'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/stands/{id}/keypad/permissions:
    parameters:
      - $ref: '#/components/parameters/StandId'
    post:
      tags: [ keypad ]
      summary: Assegna un permesso di postazione (CASHIER, KITCHEN, DELIVERY, VIEWER, OWNER) a un utente per questa cantina
      operationId: addStandStaffPermission
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StandStaffPermissionCreate'
      responses:
        '200':
          description: Permesso aggiunto e stato aggiornato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandKeypadState'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/stands/{id}/keypad/permissions/{permissionId}:
    parameters:
      - $ref: '#/components/parameters/StandId'
      - name: permissionId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    delete:
      tags: [ keypad ]
      summary: Revoca un permesso di postazione precedentemente assegnato a un utente sulla cantina
      operationId: deleteStandStaffPermission
      responses:
        '200':
          description: Permesso revocato e stato aggiornato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandKeypadState'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/stands/{id}/keypad/orders:
    parameters:
      - $ref: '#/components/parameters/StandId'
    post:
      tags: [ keypad ]
      summary: Postazione CASSA (Web o ESP32 #1) — Conferma un nuovo ordine decrementando le porzioni e accodandolo per Cucina e Consegna
      operationId: createStandKeypadOrder
      parameters:
        - name: X-Device-Token
          in: header
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StandKeypadOrderCreate'
      responses:
        '201':
          description: Ordine creato con numero progressivo assegnato e stato pulsantiera aggiornato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandKeypadState'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/stands/{id}/keypad/kitchen/press:
    parameters:
      - $ref: '#/components/parameters/StandId'
    post:
      tags: [ keypad ]
      summary: Postazione CUCINA (Web o ESP32 #2) — Segna 1 porzione pronta per lo slot premuto sull'ordine più vecchio in attesa
      operationId: pressKitchenKeypadSlot
      parameters:
        - name: X-Device-Token
          in: header
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StandKeypadSlotPress'
      responses:
        '200':
          description: Porzione segnata come pronta in cucina e stato LED aggiornato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandKeypadState'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/stands/{id}/keypad/delivery/press:
    parameters:
      - $ref: '#/components/parameters/StandId'
    post:
      tags: [ keypad ]
      summary: Postazione CONSEGNA (Web o ESP32 #3) — Segna 1 porzione servita per lo slot premuto sull'ordine corrente in uscita e avanza automaticamente al prossimo ordine quando tutti i piatti sono stati consegnati
      operationId: pressDeliveryKeypadSlot
      parameters:
        - name: X-Device-Token
          in: header
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StandKeypadSlotPress'
      responses:
        '200':
          description: Porzione consegnata; se l'ordine corrente è completo, passa automaticamente al numero d'ordine successivo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandKeypadState'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/stands/{id}/keypad/orders/reset-counter:
    parameters:
      - $ref: '#/components/parameters/StandId'
    post:
      tags: [ keypad ]
      summary: Azzera la coda attiva e riporta il contatore progressivo ordini a #1 (inizio nuova serata/turno, richiede OWNER o ADMIN)
      operationId: resetStandKeypadCounter
      responses:
        '200':
          description: Contatore ordini riportato a 1 e stato aggiornato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandKeypadState'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/stands/{id}/keypad/orders/{orderId}/cancel:
    parameters:
      - $ref: '#/components/parameters/StandId'
      - name: orderId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [ keypad ]
      summary: Annulla un singolo ordine attivo in coda e ripristina automaticamente le porzioni disponibili nel menu (richiede CASHIER o OWNER)
      operationId: cancelStandKeypadOrder
      responses:
        '200':
          description: Ordine annullato, porzioni ripristinate e stato pulsantiera aggiornato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandKeypadState'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/stands/{id}/keypad/orders/{orderId}/complete:
    parameters:
      - $ref: '#/components/parameters/StandId'
      - name: orderId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [ keypad ]
      summary: Forza il completamento immediato (DELIVERED) di un singolo ordine in coda (richiede DELIVERY o OWNER)
      operationId: completeStandKeypadOrder
      responses:
        '200':
          description: Ordine segnato come completamente consegnato e avanzamento coda aggiornato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandKeypadState'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  parameters:
    StandId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid

  schemas:
    MenuKind:
      type: string
      enum: [FOOD, DRINK]

    OwnerRole:
      type: string
      enum: [PRIMARY, SECONDARY]

    LocalizedText:
      type: object
      required: [it, en]
      properties:
        it:
          type: string
        en:
          type: string

    StandSummary:
      type: object
      required: [id, number, name, description, firstParticipationYear, latitude, longitude]
      properties:
        id:
          type: string
          format: uuid
        number:
          type: integer
          description: Numero della cantina come stampato sui volantini (es. 1..58)
        name:
          type: string
          example: "Il tartufo del Tobia"
        description:
          $ref: '#/components/schemas/LocalizedText'
        firstParticipationYear:
          type: integer
        latitude:
          type: number
          format: double
        longitude:
          type: number
          format: double
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        activeOrdersCount:
          type: integer
          description: Numero di ordini attualmente in coda nella pulsantiera della cantina
        currentServingOrderNumber:
          type: integer
          description: Numero dell'ordine attualmente in preparazione/consegna al bancone (0 se coda vuota)
        estimatedWaitMinutes:
          type: integer
          description: Stima indicativa dei minuti di attesa in base alla coda ordini attiva

    StandDetail:
      allOf:
        - $ref: '#/components/schemas/StandSummary'
        - type: object
          required: [owners, menuItems]
          properties:
            owners:
              type: array
              items:
                $ref: '#/components/schemas/Owner'
            menuItems:
              type: array
              items:
                $ref: '#/components/schemas/MenuItem'

    StandCreate:
      type: object
      required: [number, name, description, firstParticipationYear, latitude, longitude]
      properties:
        number:
          type: integer
          minimum: 1
          maximum: 999
        name:
          type: string
          minLength: 1
          maxLength: 200
        description:
          $ref: '#/components/schemas/LocalizedText'
        firstParticipationYear:
          type: integer
          minimum: 1900
          maximum: 2200
        latitude:
          type: number
          format: double
          minimum: -90
          maximum: 90
        longitude:
          type: number
          format: double
          minimum: -180
          maximum: 180

    StandUpdate:
