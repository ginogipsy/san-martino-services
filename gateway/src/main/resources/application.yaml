spring:
  application:
    name: gateway
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: events
              uri: ${EVENTS_URI:http://localhost:8081}
              predicates:
                - Path=/v1/events/**
              filters:
                - CircuitBreaker=eventsCb,forward:/fallback/events
            - id: stands
              uri: ${STANDS_URI:http://localhost:8082}
              predicates:
                - Path=/v1/stands/**
              filters:
                - CircuitBreaker=standsCb,forward:/fallback/stands

server:
  port: ${GATEWAY_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,gateway

resilience4j:
  circuitbreaker:
    instances:
      eventsCb:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
      standsCb:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
  timelimiter:
    instances:
      eventsCb:
        timeoutDuration: 5s
      standsCb:
        timeoutDuration: 5s

logging:
  level:
    root: INFO
    org.springframework.cloud.gateway: INFO
    com.ginogipsy.sanmartino: DEBUG
