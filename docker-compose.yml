services:
  postgres-events:
    image: postgres:17-alpine
    container_name: san-martino-postgres-events
    environment:
      POSTGRES_DB: events
      POSTGRES_USER: events
      POSTGRES_PASSWORD: events
    ports:
      - "5433:5432"
    volumes:
      - postgres-events-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U events -d events"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres-stands:
    image: postgres:17-alpine
    container_name: san-martino-postgres-stands
    environment:
      POSTGRES_DB: stands
      POSTGRES_USER: stands
      POSTGRES_PASSWORD: stands
    ports:
      - "5434:5432"
    volumes:
      - postgres-stands-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stands -d stands"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres-saga:
    image: postgres:17-alpine
    container_name: san-martino-postgres-saga
    environment:
      POSTGRES_DB: saga
      POSTGRES_USER: saga
      POSTGRES_PASSWORD: saga
    ports:
      - "5435:5432"
    volumes:
      - postgres-saga-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saga -d saga"]
      interval: 5s
      timeout: 5s
      retries: 10

  # --- NUOVO: Database PostgreSQL dedicato a Keycloak ---
  postgres-keycloak:
    image: postgres:17-alpine
    container_name: san-martino-postgres-keycloak
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak_password
    ports:
      - "5436:5432" # Porta host incrementata (5436) per evitare conflitti esterni
    volumes:
      - postgres-keycloak-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres-auth:
    image: postgres:17-alpine
    container_name: san-martino-postgres-auth
    environment:
      POSTGRES_DB: auth
      POSTGRES_USER: auth
      POSTGRES_PASSWORD: auth
    ports:
      - "5437:5432"
    volumes:
      - postgres-auth-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U auth -d auth" ]
      interval: 5s
      timeout: 5s
      retries: 10

  # --- NUOVO: Servizio Keycloak basato su PostgreSQL ---
  keycloak:
    image: quay.io/keycloak/keycloak:latest
    container_name: san-martino-keycloak
    command: start-dev --import-realm
    environment:
      # Nuove variabili d'ambiente Keycloak (valide da Keycloak 24+) per l'utente amministratore iniziale
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin

      # Configurazione Database per PostgreSQL
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres-keycloak:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak_password
    ports:
      - "9080:8080"
    volumes:
      # Monta il file JSON nella cartella di importazione predefinita di Keycloak
      - ./mio-realm-export.json:/opt/keycloak/data/import/realm.json
    depends_on:
      postgres-keycloak:
        condition: service_healthy # Keycloak parte solo quando PostgreSQL risponde effettivamente all'healthcheck

  kafka:
    image: apache/kafka:3.8.0
    container_name: san-martino-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      CLUSTER_ID: "san-martino-cluster-1"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  vault:
    image: hashicorp/vault:latest
    container_name: san-martino-vault
    ports:
      - "8200:8200"
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: "my-root-token"
      VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
    cap_add:
      - IPC_LOCK
      - SYS_PTRACE
      - SYS_ADMIN
    healthcheck:
      test: [ "CMD", "vault", "status", "-address=http://127.0.0.1:8200" ]
      interval: 5s
      timeout: 10s
      retries: 5
      start_period: 10s

  vault-init: # Questo servizio si occupa di popolare Vault
    image: hashicorp/vault:latest # CAMBIATO: Usa l'immagine Vault per avere il client preinstallato
    container_name: san-martino-vault-init # Aggiunto un nome per chiarezza
    # ATTENZIONE: usare SEMPRE uno scalare literal (|) e non folded (>).
    # Con `>` YAML collassa i newline in spazi: le continuazioni `\` si rompono,
    # ogni `vault kv put` parte senza dati ("Must supply data") e il container
    # esce comunque 0 perché l'ultimo comando è un echo → fallimento silenzioso.
    # `set -e` garantisce che un kv put fallito faccia fallire il container.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        # VAULT_ADDR e VAULT_TOKEN arrivano dal blocco environment: niente
        # `-address=` ripetuti e niente `vault login`.
        until vault status > /dev/null 2>&1; do
          echo 'Waiting for Vault to be unsealed and ready...'
          sleep 2
        done
        echo 'Vault is ready. Populating secrets...'

        vault kv put secret/auth-service \
            spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:9080/realms/san-martino \
            spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:9080/realms/san-martino/protocol/openid-connect/certs \
            spring.datasource.url=jdbc:postgresql://localhost:5437/events/auth \
            spring.datasource.username=auth \
            spring.datasource.password=auth \
            keycloak.server-url=http://localhost:9080 \
            keycloak.realm=san-martino \
            keycloak.client-id=admin-cli-wrapper \
            keycloak.client-secret=d457ab89-9283-4d14-b3ba-8f82a5a244f5

        vault kv put secret/events-service \
            spring.datasource.url=jdbc:postgresql://localhost:5433/events \
            spring.datasource.username=events \
            spring.datasource.password=events

        vault kv put secret/gateway \
            EVENTS_URI=http://localhost:8081 \
            STANDS_URI=http://localhost:8082

        vault kv put secret/notifications-service \
            spring.kafka.bootstrap-servers=localhost:9092 \
            sanmartino.fcm.credentials-path=/path/to/your/fcm/credentials.json

        vault kv put secret/saga-orchestrator \
            spring.datasource.url=jdbc:postgresql://localhost:5435/saga \
            spring.datasource.username=saga \
            spring.datasource.password=saga \
            clients.events-base-url=http://localhost:8081 \
            clients.stands-base-url=http://localhost:8082 \
            spring.kafka.bootstrap-servers=localhost:9092

        vault kv put secret/stands-service \
            spring.datasource.url=jdbc:postgresql://localhost:5434/stands \
            spring.datasource.username=stands \
            spring.datasource.password=stands

        echo 'Vault population complete.'
    environment:
      VAULT_ADDR: http://vault:8200 # Usa il nome del servizio Docker Compose
      VAULT_TOKEN: my-root-token # Passa il token per l'autenticazione
    depends_on:
      vault:
        condition: service_healthy # vault-init parte solo quando Vault è healthy
    restart: "no" # Questo servizio deve essere eseguito solo una volta e poi terminare

  auth-service:
    build: ./auth-service
    ports:
      - "8085:8085"
    depends_on:
      vault-init:
        condition: service_completed_successfully # AGGIUNTO: auth-service parte solo dopo che vault-init ha finito
      postgres-auth: # Assicurati che dipenda anche dal suo DB
        condition: service_healthy
      keycloak: # E da Keycloak se necessario
        condition: service_healthy
      kafka: # E da Kafka se necessario
        condition: service_healthy
  events-service:
    build: ./events-service
    ports:
      - "8081:8081"
    depends_on:
      vault-init:
        condition: service_completed_successfully
      postgres-events:
        condition: service_healthy
      kafka:
        condition: service_healthy
  gateway:
    build: ./gateway
    ports:
      - "8080:8080"
    depends_on:
      vault-init:
        condition: service_completed_successfully
      events-service: # Gateway instrada a events-service
        condition: service_healthy
      stands-service: # Gateway instrada a stands-service
        condition: service_healthy
      auth-service: # Gateway instrada a auth-service
        condition: service_healthy
      kafka:
        condition: service_healthy
  notifications-service:
    build: ./notifications-service
    ports:
      - "8084:8084"
    depends_on:
      vault-init:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
  saga-orchestrator:
    build: ./saga-orchestrator
    ports:
      - "8083:8083"
    depends_on:
      vault-init:
        condition: service_completed_successfully
      postgres-saga:
        condition: service_healthy
      kafka:
        condition: service_healthy
      events-service: # Saga orchestra anche events-service
        condition: service_healthy
      stands-service: # Saga orchestra anche stands-service
        condition: service_healthy
      auth-service: # Saga orchestra anche auth-service
        condition: service_healthy
  stands-service:
    build: ./stands-service
    ports:
      - "8082:8082"
    depends_on:
      vault-init:
        condition: service_completed_successfully
      postgres-stands:
        condition: service_healthy
      kafka:
        condition: service_healthy

  # Verranno aggiunti progressivamente:
  # grafana, loki, prometheus, tempo

volumes:
  postgres-events-data:
  postgres-stands-data:
  postgres-saga-data:
  postgres-keycloak-data: # Nuovo volume registrato
  postgres-auth-data: # Nuovo volume registrato
