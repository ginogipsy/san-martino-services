services:
  postgres-events:
    image: postgres:17-alpine
    container_name: sanmartino-postgres-events
    environment:
      POSTGRES_DB: events
      POSTGRES_USER: events
      POSTGRES_PASSWORD: events
    ports:
      - "5433:5432"
    volumes:
      - postgres-events-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U events -d events"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres-stands:
    image: postgres:17-alpine
    container_name: sanmartino-postgres-stands
    environment:
      POSTGRES_DB: stands
      POSTGRES_USER: stands
      POSTGRES_PASSWORD: stands
    ports:
      - "5434:5432"
    volumes:
      - postgres-stands-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stands -d stands"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres-saga:
    image: postgres:17-alpine
    container_name: sanmartino-postgres-saga
    environment:
      POSTGRES_DB: saga
      POSTGRES_USER: saga
      POSTGRES_PASSWORD: saga
    ports:
      - "5435:5432"
    volumes:
      - postgres-saga-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saga -d saga"]
      interval: 5s
      timeout: 5s
      retries: 10

  # --- NUOVO: Database PostgreSQL dedicato a Keycloak ---
  postgres-keycloak:
    image: postgres:17-alpine
    container_name: sanmartino-postgres-keycloak
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak_password
    ports:
      - "5436:5432" # Porta host incrementata (5436) per evitare conflitti esterni
    volumes:
      - postgres-keycloak-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      timeout: 5s
      retries: 10

  # --- NUOVO: Servizio Keycloak basato su PostgreSQL ---
  keycloak:
    image: quay.io/keycloak/keycloak:latest
    container_name: sanmartino-keycloak
    command: start-dev
    environment:
      # Nuove variabili d'ambiente Keycloak (valide da Keycloak 24+) per l'utente amministratore iniziale
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin

      # Configurazione Database per PostgreSQL
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres-keycloak:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak_password
    ports:
      - "8080:8080"
    depends_on:
      postgres-keycloak:
        condition: service_healthy # Keycloak parte solo quando PostgreSQL risponde effettivamente all'healthcheck

  kafka:
    image: apache/kafka:3.8.0
    container_name: sanmartino-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      CLUSTER_ID: "sanmartino-cluster-1"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Verranno aggiunti progressivamente:
  # grafana, loki, prometheus, tempo

volumes:
  postgres-events-data:
  postgres-stands-data:
  postgres-saga-data:
  postgres-keycloak-data: # Nuovo volume registrato
